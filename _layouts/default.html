<!doctype html>
<html lang="{{ site.lang | default: 'fr' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f8fb">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.theme_version }}">
    {% if page.layout == 'radio' %}<link rel="stylesheet" href="{{ '/assets/css/radio.css' | relative_url }}?v=1">{% endif %}
  </head>
  <body>
    <a class="skip-link" href="#contenu">Aller au contenu</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-name" href="{{ '/' | relative_url }}"><span class="brand-mark" aria-hidden="true">✳</span><span>{{ site.title }}<small>jardin numérique</small></span></a>
        <nav aria-label="Navigation principale">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Accueil</a>
          <a href="{{ '/explorer/' | relative_url }}"{% if page.url == '/explorer/' %} aria-current="page"{% endif %}>Explorer</a>
          <a href="{{ '/radio/' | relative_url }}"{% if page.url == '/radio/' %} aria-current="page"{% endif %}>Radio</a>
          <a href="{{ '/a-propos/' | relative_url }}"{% if page.url == '/a-propos/' %} aria-current="page"{% endif %}>À propos</a>
        </nav>
      </header>
      <main id="contenu">{{ content }}</main>
      <footer class="site-footer">
        <span>© {{ 'now' | date: '%Y' }} {{ site.title }} <span aria-hidden="true">·</span> Cultivé au fil des idées</span>
        <a href="{{ '/feed.xml' | relative_url }}">Flux RSS ↗</a>
      </footer>
    </div>
  </body>
</html>
