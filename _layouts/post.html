---
layout: default
---
<article class="article">
  <header class="article-header">
    <a class="back-link" href="{{ '/' | relative_url }}">← Tous les articles</a>
    <p class="eyebrow"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: '%d.%m.%Y' }}</time>{% if page.reading_time %} · {{ page.reading_time }} min de lecture{% endif %}</p>
    <h1>{{ page.title | escape }}</h1>
    {% if page.description %}<p class="article-lead">{{ page.description | escape }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
  <p class="article-end"><a href="{{ '/' | relative_url }}">← Retour aux articles</a></p>
</article>
