title: Notes de code
description: Un jardin numérique de notes, d'idées et de projets en cours.
theme_version: bleu-roi-20261012
url: https://bwik05.github.io
baseurl: /personal-site
lang: fr
timezone: Europe/Zurich
markdown: kramdown
permalink: /articles/:title/
future: false
collections:
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope:
      path: ""
      type: notes
    values:
      layout: note
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
